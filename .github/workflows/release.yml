name: build-binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed by the release job

jobs:
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck (server + web)
        run: bun run typecheck

      - name: Server test suite
        run: bun run test

      - name: Check version strings agree
        run: |
          VERSION_TS=$(sed -nE 's/.*VERSION = "([^"]+)".*/\1/p' server/src/version.ts)
          PKG_ROOT=$(node -p "require('./package.json').version")
          PKG_SERVER=$(node -p "require('./server/package.json').version")
          PKG_WEB=$(node -p "require('./web/package.json').version")
          echo "version.ts=$VERSION_TS package.json=$PKG_ROOT server/package.json=$PKG_SERVER web/package.json=$PKG_WEB"
          for v in "$PKG_ROOT" "$PKG_SERVER" "$PKG_WEB"; do
            if [ "$v" != "$VERSION_TS" ]; then
              echo "::error::server/src/version.ts VERSION ($VERSION_TS) does not match a package.json version ($v)"
              exit 1
            fi
          done
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION_TS" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($VERSION_TS)"
              exit 1
            fi
          fi

  build:
    name: ${{ matrix.target }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            artifact: brain-md-linux-x64
            ext: ""
          - target: bun-linux-arm64
            artifact: brain-md-linux-arm64
            ext: ""
          - target: bun-darwin-x64
            artifact: brain-md-darwin-x64
            ext: ""
          - target: bun-darwin-arm64
            artifact: brain-md-darwin-arm64
            ext: ""
          - target: bun-windows-x64
            artifact: brain-md-windows-x64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin to a concrete version — `latest` makes setup-bun hit the
          # GitHub API to resolve the tag, which is rate-limited and
          # flakes with 404 on busy days (v0.2.1 first run lost arm64 +
          # windows-x64 to exactly that). Bump deliberately.
          bun-version: "1.3.14"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build web client (Vite)
        working-directory: web
        run: bun run build

      - name: Embed web bundle into the server tree
        # Scans web/dist/, overwrites server/src/web/assets.ts with a
        # module that imports every file using `with { type: "file" }`.
        # Those imports are what Bun's --compile picks up and bakes
        # into the resulting binary.
        run: bun scripts/gen-web-assets.ts

      - name: Compile single-binary for ${{ matrix.target }}
        run: |
          mkdir -p dist
          bun build \
            --compile \
            --minify \
            --sourcemap=none \
            --target=${{ matrix.target }} \
            --outfile=dist/${{ matrix.artifact }}${{ matrix.ext }} \
            server/src/index.ts

      - name: Inspect output
        run: ls -lh dist/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 30

      # Also publish the raw web bundle as a separate artifact — the
      # server's Tier-3 fallback downloads it when a source checkout has
      # no embedded assets and no local web/dist. Only one job needs to
      # upload it; the first one (linux-x64) does.
      - name: Upload web bundle (linux-x64 job only)
        if: matrix.target == 'bun-linux-x64'
        run: tar -czf web-dist.tar.gz -C web/dist .
      - name: Upload web-dist.tar.gz
        if: matrix.target == 'bun-linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Show downloaded files
        run: ls -lh artifacts/
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
